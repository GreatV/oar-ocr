# One case per model architecture. Run from the repository root with
# --features cuda,nvml; add cases to compare checkpoints of the same family.
[inputs]
image_dirs = ["benchmark-inputs"]

[defaults]
device = "cuda:0"
warmup = 2
repetitions = 5

[defaults.options]
cpu_threads = 4

[[cases]]
name = "ocr-tiny"
kind = "ocr"
[cases.models]
detector = "pp-ocrv6_tiny_det.onnx"
recognizer = "pp-ocrv6_tiny_rec.onnx"
dictionary = "ppocrv6_tiny_dict.txt"

[[cases]]
name = "ocr-small"
kind = "ocr"
[cases.models]
detector = "pp-ocrv6_small_det.onnx"
recognizer = "pp-ocrv6_small_rec.onnx"
dictionary = "ppocrv6_dict.txt"

[[cases]]
name = "ocr-medium"
kind = "ocr"
[cases.models]
detector = "pp-ocrv6_medium_det.onnx"
recognizer = "pp-ocrv6_medium_rec.onnx"
dictionary = "ppocrv6_dict.txt"

[[cases]]
name = "structure-v3"
kind = "structure"
[cases.models]
layout = "pp-doclayoutv3.onnx"
layout_name = "PP-DocLayoutV3"
detector = "pp-ocrv6_tiny_det.onnx"
recognizer = "pp-ocrv6_tiny_rec.onnx"
dictionary = "ppocrv6_tiny_dict.txt"
table_dictionary = "table_structure_dict_ch.txt"
table_classifier = "pp-lcnet_x1_0_table_cls.onnx"
wired_table_structure = "slanext_wired.onnx"
wireless_table_structure = "slanet_plus.onnx"
wired_table_cells = "rt-detr-l_wired_table_cell_det.onnx"

[[cases]]
name = "vl-hpd-parsing"
kind = "vl"
model = "PaddlePaddle/HPD-Parsing"
model_path = "models/PaddlePaddle/HPD-Parsing"

[[cases]]
name = "vl-hunyuanocr"
kind = "vl"
model = "tencent/HunyuanOCR"
