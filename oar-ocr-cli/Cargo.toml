[package]
name = "oar-ocr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line OCR and document parsing with automatic model downloads"
readme = "README.md"
keywords = ["ocr", "cli", "document", "computer-vision"]
categories = ["command-line-utilities", "computer-vision"]

[[bin]]
name = "oar"
path = "src/main.rs"

[features]
default = ["auto-download", "download-binaries", "simd"]
auto-download = ["oar-ocr/auto-download", "oar-ocr-vl/auto-download"]
download-binaries = ["oar-ocr/download-binaries"]
simd = ["oar-ocr/simd"]
cuda = ["oar-ocr/cuda", "oar-ocr-vl/cuda", "dep:ort", "ort/cuda"]
metal = ["oar-ocr/coreml", "oar-ocr-vl/metal", "dep:ort", "ort/coreml"]
directml = ["oar-ocr/directml"]
coreml = ["oar-ocr/coreml", "dep:ort", "ort/coreml"]

[dependencies]
anyhow = "1"
clap.workspace = true
hayro.workspace = true
image.workspace = true
oar-ocr = { version = "0.10.0", path = "..", default-features = false }
oar-ocr-vl = { version = "0.10.0", path = "../oar-ocr-vl", default-features = false }
# Only explicit accelerator registration needs the ORT SDK directly.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std"] }
rayon.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
